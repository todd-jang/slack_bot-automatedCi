<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSD Process Manager – Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary:    #0d1117;
      --bg-secondary:  #161b22;
      --bg-card:       #1c2333;
      --bg-hover:      #21293a;
      --border:        #30363d;
      --text-primary:  #e6edf3;
      --text-secondary:#8b949e;
      --text-muted:    #6e7681;
      --accent:        #58a6ff;
      --accent-glow:   rgba(88,166,255,0.15);
      --green:         #3fb950;
      --green-bg:      rgba(63,185,80,0.15);
      --red:           #f85149;
      --red-bg:        rgba(248,81,73,0.15);
      --yellow:        #d29922;
      --yellow-bg:     rgba(210,153,34,0.15);
      --purple:        #bc8cff;
      --font-sans:     'Inter', -apple-system, sans-serif;
      --font-mono:     'JetBrains Mono', 'Fira Code', monospace;
      --radius:        10px;
      --radius-sm:     6px;
      --shadow:        0 4px 24px rgba(0,0,0,0.4);
    }
    html { font-size: 14px; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── Layout ───────────────────────────────── */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ─── Header ───────────────────────────────── */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px; color: #fff;
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    .header h1 span { color: var(--text-secondary); font-weight: 400; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--green);
      font-family: var(--font-mono);
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(63,185,80,0.6); }
      50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(63,185,80,0); }
    }
    .clock { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }

    /* ─── Main Grid ────────────────────────────── */
    .main { padding: 24px 28px; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

    /* ─── Metric Cards (top row) ───────────────── */
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color .2s, box-shadow .2s;
    }
    .metric-card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .metric-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
    .metric-value { font-size: 28px; font-weight: 700; font-family: var(--font-mono); }
    .metric-bar-bg {
      height: 6px; border-radius: 3px; background: var(--bg-primary); overflow: hidden;
    }
    .metric-bar {
      height: 100%; border-radius: 3px;
      transition: width .6s cubic-bezier(.25,.8,.25,1);
    }
    .metric-bar.cpu    { background: linear-gradient(90deg, var(--accent), var(--purple)); }
    .metric-bar.mem    { background: linear-gradient(90deg, var(--green), #0ea5e9); }
    .metric-bar.disk   { background: linear-gradient(90deg, var(--yellow), #f97316); }
    .metric-bar.gpu    { background: linear-gradient(90deg, var(--purple), #ec4899); }
    .metric-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

    /* ─── Process Table ────────────────────────── */
    .section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title .icon { font-size: 18px; }
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 24px;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted); font-weight: 600;
      padding: 12px 16px; text-align: left;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 16px; font-size: 13px;
      border-bottom: 1px solid rgba(48,54,61,0.5);
      font-family: var(--font-mono);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-hover); }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }
    .status-online  { background: var(--green-bg); color: var(--green); }
    .status-stopped  { background: rgba(139,148,158,0.15); color: var(--text-secondary); }
    .status-errored  { background: var(--red-bg); color: var(--red); }

    .action-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-secondary); padding: 4px 10px;
      border-radius: var(--radius-sm); cursor: pointer;
      font-size: 12px; font-family: var(--font-mono);
      transition: all .15s;
      margin-right: 4px;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .action-btn.danger:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }
    .action-btn.success:hover { border-color: var(--green); color: var(--green); background: var(--green-bg); }

    /* ─── Bottom Grid: Logs + Metrics ──────────── */
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .log-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; flex-direction: column;
      max-height: 400px;
    }
    .log-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .log-header h3 { font-size: 13px; font-weight: 600; }
    .log-tabs { display: flex; gap: 4px; }
    .log-tab {
      padding: 4px 10px; border-radius: var(--radius-sm);
      font-size: 11px; cursor: pointer; border: none;
      background: transparent; color: var(--text-secondary);
      font-family: var(--font-mono);
      transition: all .15s;
    }
    .log-tab.active { background: var(--accent-glow); color: var(--accent); }
    .log-tab:hover { color: var(--accent); }
    .log-body {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      font-family: var(--font-mono); font-size: 12px;
      line-height: 1.8; color: var(--text-secondary);
    }
    .log-body::-webkit-scrollbar { width: 6px; }
    .log-body::-webkit-scrollbar-track { background: transparent; }
    .log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line .ts { color: var(--text-muted); margin-right: 8px; }

    /* ─── Metrics Chart Panel ──────────────────── */
    .chart-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; flex-direction: column;
      max-height: 400px;
    }
    .chart-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .chart-header h3 { font-size: 13px; font-weight: 600; }
    .chart-body { flex: 1; padding: 16px; overflow: hidden; position: relative; }
    canvas { width: 100% !important; height: 100% !important; }

    /* ─── Responsive ───────────────────────────── */
    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .bottom-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">⚡</div>
        <h1>FSD Process Manager <span>v1.0</span></h1>
      </div>
      <div class="header-right">
        <div class="live-badge"><div class="live-dot"></div> LIVE</div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <main class="main">
      <!-- Metric Cards -->
      <div class="grid">
        <div class="metric-card">
          <div class="metric-label">CPU Usage</div>
          <div class="metric-value" id="cpu-val">--%</div>
          <div class="metric-bar-bg"><div class="metric-bar cpu" id="cpu-bar" style="width:0%"></div></div>
          <div class="metric-sub" id="cpu-sub">-- cores · load --</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Memory</div>
          <div class="metric-value" id="mem-val">--%</div>
          <div class="metric-bar-bg"><div class="metric-bar mem" id="mem-bar" style="width:0%"></div></div>
          <div class="metric-sub" id="mem-sub">-- / -- GB</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Disk</div>
          <div class="metric-value" id="disk-val">--%</div>
          <div class="metric-bar-bg"><div class="metric-bar disk" id="disk-bar" style="width:0%"></div></div>
          <div class="metric-sub" id="disk-sub">-- / -- GB</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">GPU</div>
          <div class="metric-value" id="gpu-val">--</div>
          <div class="metric-bar-bg"><div class="metric-bar gpu" id="gpu-bar" style="width:0%"></div></div>
          <div class="metric-sub" id="gpu-sub">--</div>
        </div>
      </div>

      <!-- Process Table -->
      <div class="section-title"><span class="icon">📦</span> Processes</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Status</th>
              <th>PID</th>
              <th>CPU</th>
              <th>Memory</th>
              <th>Uptime</th>
              <th>↻</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="proc-table">
            <tr><td colspan="9" style="text-align:center;color:var(--text-muted)">Loading…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Bottom: Logs + Chart -->
      <div class="bottom-grid">
        <!-- Logs Panel -->
        <div class="log-panel">
          <div class="log-header">
            <h3>📄 Logs</h3>
            <div class="log-tabs" id="log-tabs">
              <button class="log-tab active" data-name="training">training</button>
              <button class="log-tab" data-name="bot">bot</button>
              <button class="log-tab" data-name="simulator">simulator</button>
              <button class="log-tab" data-name="inference">inference</button>
            </div>
          </div>
          <div class="log-body" id="log-body">
            <div class="log-line" style="color:var(--text-muted)">No logs yet. Start a process to see output.</div>
          </div>
        </div>

        <!-- Metrics Chart -->
        <div class="chart-panel">
          <div class="chart-header"><h3>📈 Training Metrics</h3></div>
          <div class="chart-body">
            <canvas id="metrics-chart"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script>
    // ────────────────────────────────────────
    // Config
    // ────────────────────────────────────────
    const API = window.location.origin;
    const POLL_MS = 2000;
    let activeLog = "training";
    let chart = null;

    // ────────────────────────────────────────
    // Clock
    // ────────────────────────────────────────
    function updateClock() {
      const d = new Date();
      document.getElementById("clock").textContent = d.toLocaleTimeString("en-GB");
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ────────────────────────────────────────
    // Fetch helpers
    // ────────────────────────────────────────
    async function fetchJSON(url) {
      try {
        const r = await fetch(url);
        return await r.json();
      } catch { return null; }
    }

    async function postAction(name, action) {
      try {
        await fetch(`${API}/api/process/${name}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action }),
        });
      } catch (e) { console.error(e); }
    }

    // ────────────────────────────────────────
    // System Metrics
    // ────────────────────────────────────────
    async function refreshSystem() {
      const d = await fetchJSON(`${API}/api/system`);
      if (!d) return;

      const cpu = d.cpu || {};
      const mem = d.memory || {};
      const disk = d.disk || {};
      const gpu = d.gpu || {};

      document.getElementById("cpu-val").textContent = cpu.usage_percent + "%";
      document.getElementById("cpu-bar").style.width = cpu.usage_percent + "%";
      document.getElementById("cpu-sub").textContent = `${cpu.core_count} cores · load ${cpu.load_avg_1m}`;

      document.getElementById("mem-val").textContent = mem.usage_percent + "%";
      document.getElementById("mem-bar").style.width = mem.usage_percent + "%";
      document.getElementById("mem-sub").textContent = `${mem.used_gb} / ${mem.total_gb} GB`;

      document.getElementById("disk-val").textContent = disk.usage_percent + "%";
      document.getElementById("disk-bar").style.width = disk.usage_percent + "%";
      document.getElementById("disk-sub").textContent = `${disk.used_gb} / ${disk.total_gb} GB`;

      document.getElementById("gpu-val").textContent = gpu.available ? "Active" : "N/A";
      document.getElementById("gpu-bar").style.width = gpu.available ? "100%" : "0%";
      document.getElementById("gpu-sub").textContent = gpu.device_name;
    }

    // ────────────────────────────────────────
    // Process Table
    // ────────────────────────────────────────
    function fmtUptime(sec) {
      if (!sec || sec <= 0) return "–";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      if (h) return `${h}h ${m}m`;
      if (m) return `${m}m ${s}s`;
      return `${s}s`;
    }

    async function refreshProcesses() {
      const procs = await fetchJSON(`${API}/api/processes`);
      if (!procs) return;
      const tbody = document.getElementById("proc-table");
      tbody.innerHTML = procs.map((p, i) => `
        <tr>
          <td style="color:var(--text-muted)">${i}</td>
          <td style="color:var(--accent);font-weight:600">${p.name}</td>
          <td><span class="status-badge status-${p.status}">● ${p.status}</span></td>
          <td>${p.pid || '–'}</td>
          <td>${p.cpu.toFixed(1)}%</td>
          <td>${p.memory_mb.toFixed(1)} MB</td>
          <td>${fmtUptime(p.uptime)}</td>
          <td style="color:var(--text-muted)">${p.restarts}</td>
          <td>
            ${p.status === 'online'
              ? `<button class="action-btn danger" onclick="postAction('${p.name}','stop')">Stop</button>
                 <button class="action-btn" onclick="postAction('${p.name}','restart')">Restart</button>`
              : `<button class="action-btn success" onclick="postAction('${p.name}','start')">Start</button>`}
          </td>
        </tr>
      `).join("");
    }

    // ────────────────────────────────────────
    // Logs
    // ────────────────────────────────────────
    function setupLogTabs() {
      document.querySelectorAll(".log-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".log-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          activeLog = tab.dataset.name;
          refreshLogs();
        });
      });
    }

    async function refreshLogs() {
      const logs = await fetchJSON(`${API}/api/logs/${activeLog}?n=80`);
      const el = document.getElementById("log-body");
      if (!logs || !logs.length) {
        el.innerHTML = '<div class="log-line" style="color:var(--text-muted)">No logs yet.</div>';
        return;
      }
      el.innerHTML = logs.map(l => {
        const d = new Date(l.ts * 1000);
        const ts = d.toLocaleTimeString("en-GB");
        return `<div class="log-line"><span class="ts">${ts}</span>${escapeHTML(l.line)}</div>`;
      }).join("");
      el.scrollTop = el.scrollHeight;
    }

    function escapeHTML(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // ────────────────────────────────────────
    // Metrics Chart
    // ────────────────────────────────────────
    async function refreshMetrics() {
      const data = await fetchJSON(`${API}/api/metrics`);
      if (!data || !data.length) return;

      const labels = data.map(d => `E${d.epoch}`);
      const trainLoss = data.map(d => d.train_loss);
      const valLoss = data.map(d => d.val_loss);

      if (!chart) {
        const ctx = document.getElementById("metrics-chart").getContext("2d");
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels,
            datasets: [
              {
                label: "Train Loss",
                data: trainLoss,
                borderColor: "#58a6ff",
                backgroundColor: "rgba(88,166,255,0.1)",
                borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3,
              },
              {
                label: "Val Loss",
                data: valLoss,
                borderColor: "#3fb950",
                backgroundColor: "rgba(63,185,80,0.1)",
                borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3,
              },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "#8b949e", font: { family: "'Inter'" } } },
            },
            scales: {
              x: { ticks: { color: "#6e7681" }, grid: { color: "rgba(48,54,61,0.5)" } },
              y: { ticks: { color: "#6e7681" }, grid: { color: "rgba(48,54,61,0.5)" } },
            },
          },
        });
      } else {
        chart.data.labels = labels;
        chart.data.datasets[0].data = trainLoss;
        chart.data.datasets[1].data = valLoss;
        chart.update();
      }
    }

    // ────────────────────────────────────────
    // Main loop
    // ────────────────────────────────────────
    async function tick() {
      await Promise.all([
        refreshSystem(),
        refreshProcesses(),
        refreshLogs(),
        refreshMetrics(),
      ]);
    }

    setupLogTabs();
    tick();
    setInterval(tick, POLL_MS);
  </script>
</body>
</html>
